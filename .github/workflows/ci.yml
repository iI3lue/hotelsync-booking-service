name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_on_purpose:
        description: "Force a controlled failure to demonstrate the red path"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: iI3lue/hotelsync-loyalty-service/.github/workflows/node-service-ci.yml@ci-v1
    with:
      service_name: booking-service
      db_name: booking_db
      fail_on_purpose: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_purpose || false }}
    secrets:
      CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
